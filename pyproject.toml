[project]
name = "queue-management-patient-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
    "supervision>=0.30.0",
    "trackers>=2.6.0",
    "ultralytics>=8.4.116",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: heavy integration tests requiring models/video (deselected by default)",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
